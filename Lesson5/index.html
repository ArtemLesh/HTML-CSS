<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>BURGERS</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w-1340px">
    <header>
        <nav>
            <ul>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">MENU</a></li>
                <li><button>ORDER ONLINE</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="main-content">
            <div class="main-txt">
                <h1>NEW YORK’S FAVORITE ORGANIC HAMBURGER JOINT</h1>
            </div>
            <div class="main-img">
                <img src="imgs/main.png" alt="burgers">
            </div>
        </div>
    </main>
    <article>
        <div class="article-content">
            <div class="article-txt">
                <p>the burger above all burgers</p>
            </div>
            <div class="article-button">
                <p>Lorem ipsum dolor sit amet, consectetur<br> adipiscing elit. Aenean nec ornare neque.</p>
                <button>About Us</button>
            </div>
        </div>
    </article>
    <section>
        <div class="section-content">
            <div class="section-content-top">
                <img src="imgs/section1.png" alt="section-img">
                <img src="imgs/section2.png" alt="section-img">
            </div>
            <div class="section-content-bottom">
                <img src="imgs/section3.png" alt="section-img">
            </div>
        </div>
    </section>
    <footer>
        <div class="footer-content">
            <div class="footer-txt">order online or come visit us today</div>
            <button>Get Started</button>
        </div>
    </footer>
</div>
</body>
</html>
